message_send_rules:
  - message_name: welcome
    on_event: signup_with_marketing
    template: WELCOME_EMAIL
    channel: email
    reason: "New user signed up and opted in for marketing"

  - message_name: bank_account_ready
    on_event: link_bank_success
    requires_history:
      - event: signup | signup_with_marketing
        within_period: 24h
    template: BANK_LINK_NUDGE_SMS
    channel: sms
    reason: "User linked bank within 24h of registration"

  - message_name: insufficient_funds
    on_event: payment_failed_with_insufficient_funds
    template: INSUFFICIENT_FUNDS_EMAIL
    channel: email
    reason: "Payment failed due to lack of funds"

  - message_name: payment_retry_exhausted
    on_event: payment_retry_exhausted
    template: HIGH_RISK_ALERT
    channel: internal_alert
    reason: "Third failed payment attempt detected"